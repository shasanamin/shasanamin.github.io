# Roles and dates follow files/cv.pdf. One shared record for the homepage and /service/.
roles:
- role: Graduate Committee Representative
  organization: Purdue Computer Science
  url: https://www.cs.purdue.edu/gsa/officers.html
  years: 2025–2026
  detail: Representing graduate students in departmental discussions.
- role: Organizer
  organization: Purdue CS Graduate Research Symposium
  url: https://www.cs.purdue.edu/gsa/symposium.html
  years: '2025'
  detail: Organized the department's inaugural graduate research symposium.
- role: Officer
  organization: Purdue CS Graduate Student Board
  url: https://www.cs.purdue.edu/gsa/
  years: 2024–2026
- role: Mentor
  organization: Purdue CS Mentor–Mentee Program
  url: https://www.cs.purdue.edu/gsa/mentoring.html
  years: 2024–2026
  detail: Helping new graduate students find their footing in the department.
- role: Mentor
  organization: Code to PhD
  url: https://codetophd.github.io/
  years: '2025'
  detail: Supporting prospective CS PhD applicants from underrepresented backgrounds.
- role: Senator
  organization: Purdue Graduate Student Government
  url: https://purduegradstudents.com/about-us/
  years: 2024–2025
- role: Member
  organization: PGSG Grant Review & Allocation Committee
  url: https://grac.purduegradstudents.com/
  years: 2024–2025
- role: Judge
  organization: Purdue Spring Undergraduate Research Conference
  url: https://www.purdue.edu/undergrad-research/conferences/spring/index.php
  years: 2025–2026
  detail: Providing feedback on undergraduate research presentations.


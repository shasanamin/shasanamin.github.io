# A small collection of memorable lines. Original language only; no explanations.
# The first three were selected from Hasan's original notes.
# No author attribution is claimed.
- id: being-yourself
  lang: en
  dir: ltr
  text: "Most people can't afford to be themselves."

- id: arrogance
  lang: en
  dir: ltr
  text: "Nobody calls you arrogant when you are wrong."

- id: passing-places
  lang: ur
  dir: rtl
  text: "زندگی کے سفر میں گزر جاتے ہیں جو مقام وہ پھر نہیں آتے"

- id: greener-grass
  lang: en
  dir: ltr
  text: "The grass is greener where you water it."

- id: understand-the-fence
  lang: en
  dir: ltr
  text: "Never tear down a fence until you figure out why it was built in the first place."

- id: freedom-or-loneliness
  lang: en
  dir: ltr
  text: "And when nobody wakes you up in the morning, and when nobody waits for you at night, and when you can do whatever you want... what do you call it, freedom or loneliness?"

- id: be-careful-what-you-wish-for
  lang: en
  dir: ltr
  text: "Be careful what you wish for. You might just get it."

- id: victory-or-defeat
  lang: en
  dir: ltr
  text: "If a victory is told in detail, one can no longer distinguish it from a defeat."

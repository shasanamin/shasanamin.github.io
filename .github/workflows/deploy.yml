name: Build and deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Read the Ruby version from the repository's .ruby-version file.
          bundler-cache: true
      - name: Build and check
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec ruby scripts/test_site.rb
          bundle exec jekyll build
          python3 scripts/check_site.py _site
          touch _site/.nojekyll
          bundle exec jekyll build --baseurl /preview --destination /tmp/site-preview
          python3 scripts/check_site.py /tmp/site-preview --baseurl /preview
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site/
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site

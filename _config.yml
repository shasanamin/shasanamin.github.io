# Personal details and links
name: Hasan Amin
alternate_name: Syed Hasan Amin Mahmood
first_name: Hasan
last_name: Amin
author_names: [Syed Hasan Amin Mahmood, Hasan Amin]
description: >-
  Hasan Amin studies how AI can learn efficiently and help people make better
  decisions. He earned his PhD in Computer Science from Purdue University in
  August 2026.
url: https://shasanamin.github.io
baseurl: ""
lang: en
timezone: America/Indiana/Indianapolis
icon: /files/hasan-favicon.svg
icon_fallback: /files/hasan-favicon.ico
profile:
  image: /files/hasan-portrait.jpg
  alt: Hasan Amin
  image_width: 2594
  image_height: 2594
social:
  - name: Email
    icon: email
    url: mailto:hasanamin@purdue.edu
  - name: CV
    icon: cv
    url: /files/cv.pdf
  - name: GitHub
    icon: github
    url: https://github.com/shasanamin
  - name: Google Scholar
    icon: scholar
    url: https://scholar.google.com/citations?user=GQ79sVoAAAAJ
  - name: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/in/shasanamin
news_limit: 5
publication_limit: 10

# Build settings — routine content updates do not need changes below here.
disable_disk_cache: true
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-sitemap
defaults:
  - scope:
      path: pages
    values:
      layout: page
  - scope:
      path: files
    values:
      sitemap: false
exclude:
  - README.md
  - scripts
  - archived
  - bkp
  - cv-latex
  - vendor
  - tmp*.md
  - "**/tmp*.md"
  - "*_local*"
  - "**/*_local*"

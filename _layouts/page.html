---
layout: default
---
<article class="page-content">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
    {% if page.date %}<p class="page-description"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>{% endif %}
  </header>
  {{ content | local_links }}
</article>

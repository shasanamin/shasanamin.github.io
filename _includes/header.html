<header class="site-header">
  <nav class="container site-nav" aria-label="Main navigation">
    {% unless page.url == '/' %}
    <a class="site-brand" href="{{ '/' | site_url }}"><strong>{{ site.first_name }}</strong> {{ site.last_name }}</a>
    {% endunless %}
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation" aria-label="Open navigation" hidden>
      <span></span><span></span><span></span>
    </button>
    <div id="navigation" class="navigation">
      <ul>
        {% assign navigation_pages = site.pages | where: 'nav', true | sort: 'nav_order' %}
        {% for destination in navigation_pages %}
        <li><a href="{{ destination.nav_url | default: destination.url | site_url }}"{% if destination.url == page.url and destination.nav_url == nil %} aria-current="page"{% endif %}>{{ destination.nav_title | default: destination.title }}</a></li>
        {% endfor %}
      </ul>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" hidden>
        {% include icon.html name='moon' %}{% include icon.html name='sun' %}
      </button>
    </div>
  </nav>
  <div class="reading-progress" aria-hidden="true"><span></span></div>
</header>

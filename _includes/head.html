<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% unless page.url == '/' %}{{ page.title | escape }} | {% endunless %}{{ site.name | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="license" href="{{ '/LICENSE' | site_url }}">
<meta property="og:title" content="{% unless page.url == '/' %}{{ page.title | escape }} | {% endunless %}{{ site.name | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.profile.image | absolute_url }}">
{% if site.icon_fallback %}<link rel="icon" href="{{ site.icon_fallback | site_url }}" sizes="16x16 32x32 48x48" type="image/x-icon">{% endif %}
<link rel="icon" href="{{ site.icon | site_url }}" sizes="any" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<script src="{{ '/assets/site.js' | site_url }}"></script>
<link rel="stylesheet" href="{{ '/assets/site.css' | site_url }}">
{% if page.layout == 'home' %}
<link rel="stylesheet" href="{{ '/assets/nuggets.css' | site_url }}">
<script src="{{ '/assets/nuggets.js' | site_url }}" defer></script>
{% endif %}
{% if page.redirect %}<meta http-equiv="refresh" content="3; url={{ '/' | site_url }}">{% endif %}

{% assign news_limit = include.limit | default: site.data.news.size %}
{% if site.data.news.size > 0 %}
<table class="news">
  <tbody>
    {% for item in site.data.news limit: news_limit %}
    <tr>
      <th class="news-date" scope="row"><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b %Y' }}</time></th>
      <td class="news-text">{{ item.text | site_markdown }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No news so far...</p>
{% endif %}
